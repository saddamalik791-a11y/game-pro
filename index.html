<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Runner Cash Pro</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b0e14; color: #f0f6fc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 420px; padding: 12px; }

        /* লগইন বক্স */
        #loginScreen {
            background: #151b23; border: 1px solid #30363d;
            border-radius: 12px; padding: 25px 18px; margin-top: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6); text-align: center;
        }
        .login-title { font-size: 20px; color: #58a6ff; margin-bottom: 5px; }

        /* ড্যাশবোর্ড */
        .dashboard {
            background: #151b23; border: 1px solid #30363d;
            border-radius: 12px; padding: 12px; display: flex;
            justify-content: space-between; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 10px;
        }
        .stat-item { text-align: center; }
        .stat-item span { font-size: 11px; color: #8b949e; display: block; margin-bottom: 2px; }
        .stat-item strong { font-size: 15px; color: #58a6ff; }
        .cash-color { color: #3fb950 !important; }

        /* গেম ক্যানভাস এরিয়া */
        .canvas-holder {
            position: relative; width: 100%; height: 260px;
            border-radius: 12px; overflow: hidden; border: 1px solid #30363d;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
        }
        canvas { background: linear-gradient(180deg, #091222 0%, #102a45 100%); width: 100%; height: 100%; display: block; }

        /* গেম স্টার্ট স্ক্রিন পপআপ */
        .overlay-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(11, 14, 20, 0.85); backdrop-filter: blur(4px);
        }
        .btn-play {
            background: linear-gradient(135deg, #238636, #2ea043);
            color: #fff; border: none; padding: 14px 36px; font-size: 18px;
            font-weight: bold; border-radius: 30px; box-shadow: 0 0 20px rgba(46,160,67,0.6);
            cursor: pointer;
        }

        /* কন্ট্রোল বাটন ও উইথড্র */
        .ad-button {
            background: linear-gradient(135deg, #1f6feb, #0969da);
            color: #fff; border: none; padding: 12px; font-size: 14px;
            font-weight: bold; border-radius: 8px; width: 100%; margin: 10px 0;
            box-shadow: 0 4px 12px rgba(31,111,235,0.3); cursor: pointer;
        }
        .withdraw-box {
            background: #151b23; border: 1px solid #30363d;
            border-radius: 12px; padding: 14px; margin-top: 5px;
        }
        input {
            width: 100%; padding: 11px; margin: 8px 0; border-radius: 8px;
            border: 1px solid #30363d; background: #0b0e14; color: #fff; outline: none;
        }
        .btn-withdraw {
            background: #238636; color: #fff; border: none; padding: 12px;
            font-weight: bold; border-radius: 8px; width: 100%; cursor: pointer;
        }

        /* অ্যাড কাউন্টডাউন স্ক্রিন */
        #adView {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 1000; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
        }
        .btn-switch { background: transparent; border: 1px solid #30363d; color: #8b949e; padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- লগইন স্ক্রিন (শুধু প্রথমবার বা নম্বর বদলাতে দেখতে পাবে) -->
        <div id="loginScreen">
            <h3 class="login-title">🎮 গেমার প্রোফাইল</h3>
            <p style="font-size: 12px; color: #8b949e; margin-bottom: 15px;">টাকা উইথড্র করার জন্য আপনার সঠিক UPI ব্যাংক মোবাইল নম্বর দিন</p>
            <input type="text" id="inputPlayerName" placeholder="আপনার নাম">
            <input type="tel" id="inputPlayerPhone" placeholder="১০ সংখ্যার মোবাইল নম্বর (PhonePe/GPay)">
            <button class="btn-withdraw" style="margin-top: 8px;" onclick="registerPlayer()">গেমে প্রবেশ করুন</button>
        </div>

        <!-- মূল গেম সেকশন (লগইন করার পর ওপেন হবে) -->
        <div id="mainGameSection" style="display: none;">
            
            <!-- ড্যাশবোর্ড -->
            <div class="dashboard">
                <div class="stat-item">
                    <span>খেলোয়াড়</span>
                    <strong id="userTag">খেলোয়াড়</strong>
                </div>
                <div class="stat-item">
                    <span>কয়েন</span>
                    <strong id="coinCount">0</strong>
                </div>
                <div class="stat-item">
                    <span>ব্যালেন্স</span>
                    <strong id="cashBalance" class="cash-color">₹0.00</strong>
                </div>
                <div>
                    <button class="btn-switch" onclick="logoutPlayer()">বদলান</button>
                </div>
            </div>

            <!-- ক্যানভাস এবং প্লে বাটন -->
            <div class="canvas-holder">
                <canvas id="gameCanvas" width="360" height="260"></canvas>
                
                <div id="startOverlay" class="overlay-screen">
                    <button class="btn-play" onclick="initAndPlay()">▶ গেম স্টার্ট</button>
                    <p style="font-size: 12px; color: #8b949e; margin-top: 10px;">স্ক্রিনের যেকোনো জায়গায় ট্যাপ করে লাফান</p>
                </div>
            </div>

            <!-- ৩০ সেকেন্ডের ভিডিও অ্যাড বাটন -->
            <button id="adBtn" class="ad-button" onclick="watchSponsorAd()">
                📺 ৩০ সে. স্পনসর ভিডিও দেখুন (+ ₹০.৩০)
            </button>

            <!-- উইথড্র বক্স -->
            <div class="withdraw-box">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h4 style="font-size: 13px; color: #8b949e;">আসল টাকা উইথড্র</h4>
                    <span id="linkedPhoneDisplay" style="font-size: 11px; color: #58a6ff;"></span>
                </div>
                <input type="number" id="cashInput" placeholder="টাকার পরিমাণ (কমপক্ষে ₹০.৩০)">
                <button class="btn-withdraw" onclick="submitCashOut()">উইথড্র রিকোয়েস্ট পাঠান</button>
            </div>
        </div>

    </div>

    <!-- বিজ্ঞাপন স্ক্রিন -->
    <div id="adView">
        <h3 style="color: #58a6ff;">বিজ্ঞাপন দেখানো হচ্ছে...</h3>
        <div id="adTimerText" style="font-size: 55px; color: #ff7b72; margin: 20px 0; font-weight: bold;">30</div>
        <p style="color: #8b949e; font-size: 13px;">পুরো ৩০ সেকেন্ড দেখলে ব্যালেন্সে ₹০.৩০ যোগ হবে</p>
    </div>

    <script>
        // সাউন্ড সিন্থেসাইজার
        let audioCtx;
        function playAudio(freq, type, duration) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        const ringCoin = () => {
            playAudio(987, 'sine', 0.08);
            setTimeout(() => playAudio(1318, 'sine', 0.12), 70);
        };
        const ringJump = () => playAudio(440, 'triangle', 0.1);
        const ringDead = () => playAudio(150, 'sawtooth', 0.3);

        // Firebase কনফিগারেশন
        const firebaseConfig = {

  apiKey: "AIzaSyBL2MkFlwXu--GCyce2mer_yB7W-2XmzJ8",

  authDomain: "running-game-15125.firebaseapp.com",

  databaseURL: "https://running-game-15125-default-rtdb.firebaseio.com",

  projectId: "running-game-15125",

  storageBucket: "running-game-15125.firebasestorage.app",

  messagingSenderId: "724369788844",

  appId: "1:724369788844:web:4a560fdad91a6adf217409",

        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let phone = localStorage.getItem('player_phone');
        let playerName = localStorage.getItem('player_name');
        let coins = 0;
        let balance = 0.00;
        let userRef = null;

        function checkAuth() {
            if (phone && playerName) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainGameSection').style.display = 'block';
                document.getElementById('userTag').innerText = playerName;
                document.getElementById('linkedPhoneDisplay').innerText = 'মোবাইল: ' + phone;
                attachDBListener();
            } else {
                document.getElementById('loginScreen').style.display = 'block';
                document.getElementById('mainGameSection').style.display = 'none';
            }
        }

        function registerPlayer() {
            let nameInput = document.getElementById('inputPlayerName').value.trim();
            let phoneInput = document.getElementById('inputPlayerPhone').value.trim();

            if (!nameInput || phoneInput.length < 10) {
                alert('দয়া করে আপনার নাম এবং সঠিক ১০ সংখ্যার মোবাইল নম্বর দিন!');
                return;
            }

            phone = phoneInput;
            playerName = nameInput;
            localStorage.setItem('player_phone', phone);
            localStorage.setItem('player_name', playerName);
            checkAuth();
        }

        function logoutPlayer() {
            if (confirm('আপনি কি অন্য মোবাইল নম্বর দিয়ে খেলতে চান?')) {
                localStorage.removeItem('player_phone');
                localStorage.removeItem('player_name');
                phone = null;
                playerName = null;
                checkAuth();
            }
        }

        function attachDBListener() {
            userRef = db.ref('players/' + phone);
            userRef.on('value', (snap) => {
                const data = snap.val();
                if (data) {
                    coins = Number(data.coins) || 0;
                    balance = Number(data.balance) || 0.00;
                    updateDisplay();
                } else {
                    userRef.set({ name: playerName, phone: phone, coins: 0, balance: 0.00 });
                }
            });
        }

        function updateDisplay() {
            document.getElementById('coinCount').innerText = coins;
            document.getElementById('cashBalance').innerText = '₹' + balance.toFixed(2);
        }

        function syncDB() {
            if (userRef) {
                userRef.update({ coins: Number(coins), balance: Number(balance) });
            }
        }

        // গেমপ্লে
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let isRunning = false;
        let groundY = 220;

        let hero = { x: 40, y: groundY - 26, w: 24, h: 26, dy: 0, gravity: 0.55, jumpPower: -9.5, isGrounded: true };
        let coinList = [], barrierList = [], gameTicker = 0, gracePeriod = 0;

        window.addEventListener('touchstart', (e) => {
            if (!isRunning) return;
            if (hero.y > 60) {
                hero.dy = hero.jumpPower;
                hero.isGrounded = false;
                ringJump();
            }
        });

        function initAndPlay() {
            document.getElementById('startOverlay').style.display = 'none';
            hero.y = groundY - 26;
            hero.dy = 0;
            coinList = [];
            barrierList = [];
            gameTicker = 0;
            gracePeriod = 150;
            isRunning = true;
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }

        function gameCycle() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#21262d';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            ctx.fillStyle = '#30363d';
            ctx.fillRect(0, groundY, canvas.width, 3);

            if (isRunning) {
                gameTicker++;
                if (gracePeriod > 0) gracePeriod--;

                hero.dy += hero.gravity;
                hero.y += hero.dy;

                if (hero.y >= groundY - hero.h) {
                    hero.y = groundY - hero.h;
                    hero.dy = 0;
                    hero.isGrounded = true;
                }

                if (gameTicker % 35 === 0) {
                    let randomH = groundY - 25 - Math.floor(Math.random() * 85);
                    coinList.push({ x: canvas.width, y: randomH, r: 8 });
                }

                if (gracePeriod === 0 && gameTicker % 160 === 0) {
                    let bH = 30 + Math.floor(Math.random() * 15);
                    barrierList.push({ x: canvas.width, y: groundY - bH, w: 18, h: bH });
                }

                for (let i = 0; i < coinList.length; i++) {
                    let c = coinList[i];
                    c.x -= 3.2;

                    ctx.fillStyle = '#ffd700';
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#ffa502';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    if (hero.x < c.x + c.r && hero.x + hero.w > c.x - c.r &&
                        hero.y < c.y + c.r && hero.y + hero.h > c.y - c.r) {
                        ringCoin();
                        coins += 10;
                        if (coins >= 100) {
                            balance += 0.20;
                            coins -= 100;
                        }
                        updateDisplay();
                        syncDB();
                        coinList.splice(i, 1);
                        i--;
                    }
                }

                for (let j = 0; j < barrierList.length; j++) {
                    let b = barrierList[j];
                    b.x -= 3.2;

                    ctx.fillStyle = '#ff4757';
                    ctx.fillRect(b.x, b.y, b.w, b.h);

                    if (hero.x + hero.w > b.x && hero.x < b.x + b.w && hero.y + hero.h > b.y) {
                        endGame();
                    }
                }

                coinList = coinList.filter(c => c.x > -20);
                barrierList = barrierList.filter(b => b.x > -30);
            }

            ctx.fillStyle = '#58a6ff';
            ctx.fillRect(hero.x, hero.y, hero.w, hero.h);
            ctx.fillStyle = '#79c0ff';
            ctx.fillRect(hero.x + 4, hero.y + 4, hero.w - 8, hero.h - 8);

            requestAnimationFrame(gameCycle);
        }

        function endGame() {
    ringDead();
    isRunning = false;
    
    document.getElementById('startOverlay').style.display = 'flex';
}


            function watchSponsorAd() {
        window.open("https://up1cm.com/4/12170691", "_blank");

        const modal = document.getElementById('adView');
        const timer = document.getElementById('adTimerText');
        const btn = document.getElementById('adBtn');
        let sec = 15;

        modal.style.display = 'flex';
        timer.innerText = sec;
        btn.disabled = true;

        history.pushState({ popup: "ad" }, null, "");

        const countdown = setInterval(() => {
            sec--;
            timer.innerText = sec;
            if (sec <= 0) {
                clearInterval(countdown);
                modal.style.display = 'none';
                balance += 0.30;
                updateDisplay();
                syncDB();
                btn.disabled = false;
                ringCoin();
                alert('অভিনন্দন! ₹০.৩০ আপনার ব্যালেন্সে যুক্ত হয়েছে!');
            }
        }, 1000);

        window.onpopstate = function () {
            clearInterval(countdown);
            modal.style.display = 'none';
            btn.disabled = false;
        };
    }


        function submitCashOut() {
            let val = parseFloat(document.getElementById('cashInput').value);
            if (isNaN(val) || val < 0.30) return alert('কমপক্ষে ₹০.৩০ উইথড্র করতে হবে');
            if (val > balance) return alert('পর্যাপ্ত ব্যালেন্স নেই');

            balance -= val;
            updateDisplay();
            syncDB();

            db.ref('withdraw_requests').push({
                name: playerName,
                phone: phone,
                amount: val,
                status: 'Pending',
                time: new Date().toLocaleString()
            });
                        const botToken = "9075874273:AAG0Osi7_M-A3CBZU6Cxr_YmpMgGLfaxTIQ";
    const chatId = "8390925169";
    const msg = `🔔 নতুন উইথড্র রিকোয়েস্ট!\n👤 নাম: ${playerName}\n📱 মোবাইল: ${phone}\n💰 পরিমাণ: ₹${val}`;
            
    
    fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: chatId, text: msg })
    });


            

            alert('উইথড্র রিকোয়েস্ট সফল হয়েছে! অ্যাডমিন আপনার UPI নম্বরে টাকা পাঠিয়ে দেবে।');
            document.getElementById('cashInput').value = '';
        }

        checkAuth();
        gameCycle();
    </script>
</body>
</html>
